<bui-app-shell class="bui-bg-light-white dark:bui-bg-deep-blue-95 aboutday-appshell">
  <!-- Header -->
  <bui-header size="default" class="bui-bg-light-white dark:bui-bg-deep-blue-90">
    <bui-header-brand-logo>
      <bui-logo size="small" style="cursor: pointer;" [routerLink]="['/start']"></bui-logo>
    </bui-header-brand-logo>

    <bui-header-center>
      <div class="bui-flex bui-items-center bui-gap-2">
        <bui-search placeholder="Search..." class="dark:bui-text-white"></bui-search>
        <button bui-secondary-button
                style="cursor: pointer;"
                [routerLink]="['/start']">
          <span>Overview</span>
        </button>
      </div>
    </bui-header-center>

    <bui-header-menu>
      <button bui-icon-button icon="more-vertical"></button>
    </bui-header-menu>
  </bui-header>

  <!-- Content area -->
  <div buiAppShellContent class="bui-h-full bui-bg-light-white dark:bui-bg-deep-blue-95 bui-p-2">
    <div class="bui-flex bui-gap-3 bui-h-full">

      <!-- LEFT SHELL: render standalone component -->
      <div class="bui-shell">
          <div class="bui-shell__content bui-h-full">
            <edit-decision class="bui-block bui-h-full"></edit-decision>
          </div>
      </div>

      <!-- RIGHT SHELL: module grid -->
      <div class="bui-shell bui-flex-1">
        <div class="bui-shell-mid">
          <div class="bui-shell__content bui-h-full">
            <section class="bui-flex-1 bui-flex bui-flex-col bui-h-full bui-rounded-3 bui-border-deep-blue-60 bui-p-2">
              <div class="bui-grid bui-gap-2 bui-grid-cols-[repeat(auto-fill,minmax(120px,1fr))]">
                <button *ngFor="let m of filteredModules()"
                        class="tile-btn"
                        (click)="openModule(m)"
                        (contextmenu)="openModuleContext($event, m)">
                  {{ m.title }}
                </button>
              </div>
            </section>
          </div>
        </div>
      </div>

    </div>
  </div>
</bui-app-shell>
