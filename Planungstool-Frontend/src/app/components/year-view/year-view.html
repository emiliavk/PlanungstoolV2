<div class="bui-shell-sidebar bui-flex bui-flex-col">
  <div class="bui-shell">
    <div class="bui-shell-mid">
      <div class="bui-shell__content">

        <!-- Card: Year -->
        <section class="bui-card">
          <div class="bui-text-label-bold-14">
            {{ year }}
          </div>
          <div class="bui-text-label-regular-12">
            {{ dayLabel }} {{ monthLabel }}
          </div>
        </section>

        <!-- Card: Active Modules -->
        <section class="bui-card">
          <button bui-secondary-button class="bui-w-full bui-justify-center bui-cta">
            <span class="bui-text-label-regular-12">
              Active Modules<span *ngIf="activeModulesCount"> ({{ activeModulesCount }})</span>
            </span>
          </button>
        </section>

        <!-- Card: Weekly checklist (fills remaining height) -->
        <section class="bui-card bui-card--fill">
          <div class="bui-text-label-bold-14 bui-mb-1">This week</div>

          <div class="bui-card__scroll">
            <div *ngFor="let item of weekItems; index as i"
                 class="bui-row-flat bui-flex bui-items-center bui-justify-between">
              <span class="bui-text-label-regular-12">{{ item.label }}</span>
              <bui-checkbox (checkedChange)="toggle(i)"></bui-checkbox>
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>
