<!-- src/app/app.html -->
<bui-app-shell class="bui-bg-light-white dark:bui-bg-deep-blue-95">
  <!-- Header -->
  <bui-header size="default" class="bui-bg-light-white dark:bui-bg-deep-blue-90">
    <bui-header-brand-logo>
      <bui-logo size="small"></bui-logo>
    </bui-header-brand-logo>

    <!-- Title -->
    <bui-header-title class="dark:bui-text-white">{{ username }}</bui-header-title>

    <!-- Place the search inside the header (center slot) -->
    <bui-header-center>
      <bui-search placeholder="Search..." class="dark:bui-text-white"></bui-search>
    </bui-header-center>

    <!-- Right side menu -->
    <bui-header-menu>
      <button bui-icon-button icon=more-vertical></button>
    </bui-header-menu>
  </bui-header>

  <!-- Main content area -->
  <div buiAppShellContent class="bui-h-full bui-bg-light-white dark:bui-bg-deep-blue-95">
    <!-- Your Year View (already dark-styled) -->
    <app-year-view></app-year-view>

    <!-- Routed views -->
    <router-outlet></router-outlet>
  </div>
</bui-app-shell>
