<div class="year-sidebar bui-flex bui-flex-col">
  <div class="year-shell">
    <!-- NEW: middle wrap between the shell and the content -->
    <div class="year-mid">
      <!-- content wrapper inside mid so clipping respects rounding -->
      <div class="year-shell__content">

        <!-- Card: Year -->
        <div class="year-card">
          <div class="bui-text-label-bold-14">
            {{ year }}
          </div>
          <div class="bui-text-label-regular-12">
            {{ dayLabel }} {{ monthLabel }}
          </div>
        </div>

        <!-- Card: Active Modules -->
        <div class="year-card">
          <button bui-secondary-button class="bui-w-full bui-justify-center year-cta">
            <span class="bui-text-label-regular-12">
              Active Modules<span *ngIf="activeModulesCount"> ({{ activeModulesCount }})</span>
            </span>
          </button>
        </div>

        <!-- Card: Weekly checklist (fills the remaining height) -->
        <div class="year-card year-card--fill">
          <div class="bui-text-label-bold-14 bui-mb-1">This week</div>

          <!-- Only the list scrolls if content is taller than the available space -->
          <div class="week-list">
            <div *ngFor="let item of weekItems; index as i"
                 class="week-row bui-flex bui-items-center bui-justify-between">
              <span class="bui-text-label-regular-12">{{ item.label }}</span>
              <bui-checkbox (checkedChange)="toggle(i)"></bui-checkbox>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
